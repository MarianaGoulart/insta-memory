name: Transcribe Instagram Reel

on:
  repository_dispatch:
    types: [transcribe]

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -U yt-dlp openai-whisper requests

      - name: Download, transcribe, and commit
        env:
          INSTAGRAM_URL: ${{ github.event.client_payload.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          python3 - << 'PYEOF'
          import os
          import sys
          import time
          import tempfile
          import subprocess
          import traceback
          from datetime import datetime, timezone
          from pathlib import Path

          import requests
          import whisper

          url = os.environ["INSTAGRAM_URL"]
          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          gh_pat = os.environ["GH_PAT"]
          github_repo = os.environ["GITHUB_REPOSITORY"]

          def send_telegram(text):
              try:
                  resp = requests.post(
                      f"https://api.telegram.org/bot{bot_token}/sendMessage",
                      json={"chat_id": chat_id.strip(), "text": text},
                      timeout=10,
                  )
                  resp.raise_for_status()
              except Exception:
                  traceback.print_exc()

          cookies_content = os.environ.get("INSTAGRAM_COOKIES", "").strip()

          with tempfile.TemporaryDirectory() as tmpdir:
              cookies_path = os.path.join(tmpdir, "cookies.txt")
              if cookies_content:
                  Path(cookies_path).write_text(cookies_content)

              try:
                  # Download audio — retry up to 3 times
                  downloaded = False
                  for attempt in range(3):
                      cmd = [
                          "yt-dlp", "-x", "--audio-format", "mp3",
                          "-o", f"{tmpdir}/audio.%(ext)s",
                      ]
                      if cookies_content:
                          cmd += ["--cookies", cookies_path]
                      cmd.append(url)
                      result = subprocess.run(cmd, capture_output=True)
                      if result.returncode == 0:
                          downloaded = True
                          break
                      if attempt < 2:
                          time.sleep(5)

                  if not downloaded:
                      stderr_tail = result.stderr.decode(errors="replace")[-300:]
                      send_telegram(f"Download failed. yt-dlp said:\n{stderr_tail}")
                      sys.exit(0)

                  audio_files = list(Path(tmpdir).glob("audio.*"))
                  if not audio_files:
                      send_telegram("Couldn't download this one. Check if it's private or try again later.")
                      sys.exit(0)

                  audio_path = str(audio_files[0])

                  # Transcribe
                  model = whisper.load_model("base")
                  result = model.transcribe(audio_path)

                  transcript = result["text"].strip()
                  segments = result.get("segments", [])

                  # Quality checks
                  if len(transcript) < 100:
                      send_telegram("No speech detected in this video. Nothing saved.")
                      sys.exit(0)

                  if segments:
                      avg_no_speech = sum(s.get("no_speech_prob", 0) for s in segments) / len(segments)
                      if avg_no_speech > 0.8:
                          send_telegram("No speech detected in this video. Nothing saved.")
                          sys.exit(0)

                  # Write captures file
                  now = datetime.now(timezone.utc)
                  filename = now.strftime("%Y-%m-%dT%H%M%SZ_raw.md")
                  content = (
                      f"---\n"
                      f"captured: {now.strftime('%Y-%m-%dT%H:%M:%SZ')}\n"
                      f"source: {url}\n"
                      f"---\n\n"
                      f"{transcript}\n"
                  )

                  captures_dir = Path("captures")
                  captures_dir.mkdir(exist_ok=True)
                  (captures_dir / filename).write_text(content)

                  # Commit and push
                  subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
                  subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
                  subprocess.run(["git", "add", f"captures/{filename}"], check=True)
                  subprocess.run(["git", "commit", "-m", f"capture: {filename}"], check=True)
                  import base64
                  token_b64 = base64.b64encode(f"x-access-token:{gh_pat}".encode()).decode()
                  subprocess.run(
                      ["git", "remote", "set-url", "origin",
                       f"https://github.com/{github_repo}.git"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "config", "--local", "http.https://github.com/.extraHeader",
                       f"AUTHORIZATION: basic {token_b64}"],
                      check=True,
                  )
                  subprocess.run(["git", "push", "origin", "HEAD"], check=True)

                  send_telegram(f"Saved: {filename}")

              except Exception as exc:
                  traceback.print_exc()
                  send_telegram(f"Error: {type(exc).__name__}: {str(exc)[:300]}")
          PYEOF
